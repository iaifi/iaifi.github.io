details: "UCL is recruiting SOFAIR Fellows / SOFAIR Senior Fellows (Grades 7–10) to join the Science of Fundamental AI Research Lab (SOFAIR), a UK-wide initiative led by UCL in partnership with Oxford, Cambridge, and Edinburgh. SOFAIR is focused on developing fundamentally new AI architectures, rather than incremental improvements to existing models, with an emphasis on open, distributed, and trustworthy AI. The roles involve developing and testing new approaches to next-generation foundation models at significant scale."
