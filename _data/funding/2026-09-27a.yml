details: "The Jane Street Graduate Research Fellowship (GRF) supports exceptional doctoral students currently pursuing a PhD in electrical engineering and computer science, mathematics, physics, or statistics. At Jane Street, we take a rigorous, quantitative approach to trading on global markets, combining techniques from machine learning, distributed systems, programmable hardware, statistics, and applied mathematics. Our culture is steeped in games, puzzles, and challenging problems. With the Graduate Research Fellowship, we’re excited to support PhD students who share our values: technical excellence, intellectual curiosity, and humility."
