details: "The Tayebati Postdoctoral Fellowship Program at MIT supports exceptional researchers whose work explores the transformative potential of artificial intelligence (AI) in select science and engineering fields or in music. Hosted by the MIT Schwarzman College of Computing, the program fosters research at the forefront of AI, where novel computational approaches can advance scientific discovery or expand the possibilities of music composition and performance. By encouraging ambitious, interdisciplinary scholarship, the fellowship seeks to generate meaningful progress both within these domains and in the development of new AI methods more broadly. MIT now invites applications for the 2027–2028 cohort of fellows. Prospective fellows must have received their doctoral degree between January 1, 2024 and August 31, 2027 and must start no later than September 1, 2027. Each postdoctoral appointment is for 24 months, with continuation into the second-year contingent upon satisfactory performance, as determined through an annual review."
