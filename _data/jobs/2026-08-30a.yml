details: "AI Researcher - Large Model Inference and Internship - Large Model Reasoning Intern: The Scientific Reasoning and Discovery Team at the Shanghai Academy of AI for Science (SAIS) is looking for researchers excited to build Large Reasoning Models that can understand and solve hard scientific problems. We're building System 2 reasoning systems for science: models capable of multi-step logical deduction, cross-modal knowledge integration, and autonomous hypothesis generation and verification. You'll push LLMs past their current limits in scientific settings and help shape a new paradigm for how discovery is done. "
