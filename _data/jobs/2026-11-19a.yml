details: "Accelerating scientific discovery is a core part of Anthropic's mission, and we believe the highest-leverage path to this is enabling researchers externally to use Claude effectively for their work. This involves communicating Claude’s rapidly improving scientific capabilities through outreach and editorial programs, as well as putting Claude in the hands of researchers through grants, ergonomic research tools, and access programs that help scientists do more with AI than was previously possible. We’re hiring a Technical Program Manager to be the bridge between the researchers advancing Claude’s scientific capabilities and the outside scientific community. Embedded with the Discovery team, you’ll conceptualize and run the programs that get Claude into scientists’ hands and shape the Anthropic Science Blog, working with Communications, Editorial, Beneficial Deployments, and external partners such as universities, funders, and scientific societies. This is a technical role, not a purely operational one. These programs already have strong operational and editorial owners. You bring research taste and a firsthand understanding of how academia works, so we’re looking for someone who has been a researcher themselves, ideally through a postdoc or beyond. You’ll have significant autonomy: once aligned with Discovery’s leads on strategy, you’ll drive decisions on what we fund, what we publish, and how we engage with academic communities."
