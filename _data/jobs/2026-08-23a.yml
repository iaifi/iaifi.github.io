details: "I am looking for motivated PhD/MS students interested in machine learning and interdisciplinary AI research at Georgia Southern University, Georgia State, the United States, starting in Spring 2027. My research focuses on developing reliable, interpretable, and data-efficient machine learning methods and applying them to challenging problems across different disciplines. Students will have opportunities to collaborate with faculty from other disciplines and departments, working on interdisciplinary research problems and applying ML to real-world challenges.Current and future projects may involve machine learning, deep learning, trustworthy AI, multimodal learning, and interdisciplinary data analysis, with applications across a variety of domains."
