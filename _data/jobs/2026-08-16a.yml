details: "Are you an early career researcher with the potential to become a world-class machine learning scientist? The Vector Institute invites applications for Distinguished Postdoctoral Fellows who are working on cutting-edge fundamental research in machine learning and deep learning algorithms and their applications. Our areas of research include:
<br>Computer Vision
<br>Generative Models
<br>Healthcare – computational biology, genomics
<br>Natural Language Processing
<br>Optimization
<br>Reinforcement Learning
<br>Statistical Learning Theory
<br>Sequential Decision Making
<br>Security, Privacy & Fairness
<br>Quantum Computing
<br>Materials Design & Discovery
<br>The standard term for a Distinguished Postdoctoral Fellow position is 1–2 years, with a possible extension to 3 years. Also available is the opportunity for eligible individuals to complete a placement at Vector before going on to take a faculty role elsewhere."
