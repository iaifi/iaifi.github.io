details: "In the Institute of Informatics at the University of Munich (LMU), Germany, a position as a Research Assistant at the postdoctoral level is to be filled at the earliest possible date. The position is connected to the Research Training Group METEOR (https://rtg-meteor.de) and associated with the Chair of Artificial Intelligence and Machine Learning (https://www.kiml.ifi.lmu.de/index.html). It is intended for two years with a possibility for further extension. Payment is at the level of E13 according to the German federal wage agreement scheme (TV-L). Candidates are expected to have a strong background in computer science and  mathematics, with a specialisation in machine learning (ML), dynamical systems (DS), and/or control theory. They should have an excellent publication record, ideally including major conferences in AI/ML (ICML, ICLR, NeurIPS, etc.) and/or DS/control (DCD, ACC, IFAC, etc.)"
