details: "Applications are open for the next cohort of LASR Labs, a full-time, paid research programme in technical AI safety, running 11 January – 9 April 2027 in London. Participants write a technical paper in teams of 3–4, supervised by experienced researchers (past supervisors from Google DeepMind, UK AISI, and Apollo Research). LASR papers have been accepted at top ML venues including NeurIPS, ICLR, and ICML workshops; recent highlights include three NeurIPS 2025 main conference papers, one selected for an oral, and a best paper award at an ICML 2025 workshop. It's also a strong route into the field: 90% of alumni have gone on to AI safety and security roles, at organisations including UK AISI, Apollo Research, and OpenAI's dangerous capability evaluations team."
