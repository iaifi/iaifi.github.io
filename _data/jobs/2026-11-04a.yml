details: "The NSF-Simons National AI Institute for the Sky (SkAI Institute) invites applications for SkAI Postdoctoral Associates. The SkAI Institute is bringing together astrophysics and AI researchers to advance both fields through cross-disciplinary collaboration and is serving as a nexus for the further development of a nationwide Astro-AI community. SkAI Postdoctoral Associates have the opportunity to work with SkAI faculty on specific research projects aligned with the Institute’s Astro-AI research mission. Associates will be employed by any of the three SkAI lead institutions (Northwestern University, The University of Chicago, and the University of Illinois Urbana-Champaign [UIUC]) and may collaborate closely with SkAI personnel at any of the SkAI partner institutions depending on their expertise and active research projects. They also spend time at the SkAI Hub, which is located in the historic John Hancock Center in downtown Chicago, interacting with the broader SkAI community across SkAI’s institutional partners. Postdoctoral Associates will also benefit from a diverse, cross-disciplinary, and dynamic intellectual environment (including workshops, lecture series, conferences, retreats, and more), a structured mentorship program, training opportunities, access to computing resources at UIUC’s NCSA and Argonne National Laboratory suited for AI research and to collaborations with software engineers, and will have opportunities to collaborate with peers and mentor students from SkAI academic partners (including SkAI’s Satellite Network)."
