details: "The Department of Computer Science, in the Faculty of Science at Western University, is pleased to announce a search for a limited-term (3-year) position to support its Master of Data Analytics (MDA) professional program at the rank of Assistant Professor or Lecturer. The rank and salary will be commensurate with the successful applicant’s qualifications and experience. The starting date will be January 1, 2027 or as negotiated. This appointment is intended to attract an exceptional and versatile educator with demonstrated expertise spanning both Data Science and Computer Science, and whose contributions to teaching excellence and curriculum development will have a meaningful and lasting impact in this prestigious program."
