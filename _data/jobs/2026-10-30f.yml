details: "The AstroAI Fellows program seeks to advance the integration of artificial intelligence in astrophysical research by attracting exceptional early-career researchers. Fellows will engage in innovative projects at the intersection of AI and astrophysics, fostering interdisciplinary, multi-investigator, and cross-subfield collaborations. AstroAI Fellows enjoy a high degree of academic freedom in defining their research directions within the broad AstroAI framework. While all innovative proposals at the intersection of AI and astrophysics are welcome, special consideration will be given to projects focused on (1) the search for biosignatures in exoplanet atmospheres, and (2) the development and application of Physical Generative AI models—AI generative models that respect fundamental physical principles. Each Fellow will be co-mentored by two advisors—one from astrophysics and one from AI—reflecting the program’s interdisciplinary mission."
