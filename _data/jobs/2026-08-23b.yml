details: "At PerceptAI, we are building foundation models for Physical AI and Spatial Intelligence, with a focus on enabling robots to reconstruct and understand complex real-world environments. We are looking for student Research Interns to join our team remotely and work on state-of-the-art problems in 3D computer vision, VLMs, 3D reconstruction, Gaussian Splatting, SLAM, neural scene representations, multi-view geometry, and related areas. <Br>Who we’re looking for: <Br><Br>Undergraduate, Master’s, and PhD students currently studying in the United States<Br>Hands-on experience in one or more areas: 3D computer vision, Vision-Language Models (VLM), scene reconstruction, Gaussian Splatting, SLAM, neural rendering, or closely related areas<Br>Strong implementation skills in Python and modern ML/CV frameworks such as PyTorch; C++, COLMAP, OpenCV, or CUDA experience is a plus<Br>Prior research experience: open-source work, prior internships, experience writing or contributing to research papers is a strong plus"
