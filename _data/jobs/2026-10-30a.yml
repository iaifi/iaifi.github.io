details: "The Institute of Neuroinformatics is a research institute of the Faculty of Computer Science at the Ruhr University Bochum, see https://www.ini.rub.de/. It focuses on the dynamics and learning of perception and behavior on a functional level but is otherwise very diverse, ranging from neurophysiology and psychophysics over computational neuroscience to machine learning and technical applications. Bochum is one of the centers of episodic memory research with a coherent framework developed within the DFG Research Unit 2812 "Constructing Scenarios of the Past" (https://for2812.rub.de/) combining psychology, neuroscience, philosophy, and computational neuroscience."
