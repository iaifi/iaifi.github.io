details: "We seek to appoint an Assistant Professor in the field of data science and statistics at the Department of Statistics, London School of Economics (LSE): "https://jobs.lse.ac.uk/Vacancies/W/2722/0/474075/15539/assistant-professor". You should have expertise and research interests in statistics, data science, or machine learning. You will have a track record or trajectory of internationally excellent publications, proven ability, as evidenced by existing publications, or potential to publish in top conferences or journals You will also have a clear, well-developed and viable strategy for future outstanding research that has the potential to result in world-leading publications. You must have a completed PhD, or close to obtaining a PhD in statistics or related areas such as computer science or mathematics by the post start date."
