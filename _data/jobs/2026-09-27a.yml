details: "The Postdoctoral Associate will assist the Principal Investigator Dr. Steven Skiena in the Department of Computer Science at Stony Brook University. The incumbent will conduct cutting-edge research at the intersection of AI/ML and extreme weather forecasting, employing data science models as developed in computer vision and natural language processing (NLP).  This project leverages the large-scale high-performance computing (HPC) infrastructure of New York State’s Empire AI enabling us to train large AI models that will outperform traditional numerical prediction models."
