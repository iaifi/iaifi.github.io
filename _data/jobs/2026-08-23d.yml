details: "At PerceptAI, we are building foundation models for Physical AI and Spatial Intelligence, with a focus on enabling robots to reconstruct and understand complex real-world environments. We are looking for student Research Interns to join our team remotely and work on state-of-the-art problems in 3D computer vision, VLMs, 3D reconstruction, Gaussian Splatting, SLAM, neural scene representations, multi-view geometry, and related areas."
