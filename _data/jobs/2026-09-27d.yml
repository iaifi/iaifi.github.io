details: "Applications are invited for postdoctoral research positions as Flatiron Research Fellows (FRF) at the Center for Computational Astrophysics (CCA). The CCA offers FRFs the opportunity for independent research in areas that have strong synergy with the CCA or other centers at the Flatiron Institute. Flatiron Research Fellows are expected to carry out an active research program that is independently directed and is encouraged to involve substantial collaboration with other members of the CCA or Flatiron Institute.  In addition to their own research, Fellows help build the rich scientific community at the CCA and Flatiron Institute by: participating in seminars, colloquia, and group meetings; developing their software, mathematical, and computational expertise through internal educational opportunities; and sharing their knowledge through scientific publications, presentations, and/or software releases. Flatiron Research Fellows may also have the opportunity to organize workshops and to mentor graduate and undergraduate students through the CCA Pre-Doctoral Program, the CUNY Astrophysics Masters Program, the Simons-NSBP Scholars Summer Program, and the AstroCom NYC Program. FRFs are welcome to take advantage of CCA partnerships with the Simons Observatory, the Terra Hunting Experiment, Sloan Digital Sky Survey V, Gaia, HIRAX, LIGO, and the NASA SPHEREx mission, and to participate in CCA-related software projects such as MESA, AstroPy, Entity, Dedalus, and PASTA. In addition, individual CCA research scientists have significant roles in a variety of collaborations and projects, including Learning the Universe, JWST, PRIMA, Rubin, Euclid, Roman[1] , CAMELS, DREAMS, MESA, AstroPy, Dedalus, LIGO, LISA, and Gaia, and would welcome FRF collaborators. More details can be found on our website under “Projects” and “Software”. CCA members also maintain valuable ties with neighboring academic institutions, with many senior CCA scientists having joint faculty appointments."
