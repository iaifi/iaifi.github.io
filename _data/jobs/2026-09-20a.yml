details: "The Statistical Physics of Computation Laboratory (SPOC) at EPFL invites applications for postdoctoral positions on the theoretical foundations of learning with attention and sequencemodels. The positions are supported by SPASM-net, an ERC Advanced Grant funded bythe Swiss State Secretariat for Education, Research and Innovation (SERI). We seek candidates with a PhD (completed by the start date) in physics, mathematics, statistics, computer science or a related field, strong analytical skills, and a taste for independent, interdisciplinary research. Applicants from adjacent fields are welcome; prior expertise in every topic or in statistical physics methods is not required."
