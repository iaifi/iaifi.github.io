details: "Umeå University aims to give the next generation of research leaders the best possible conditions to conduct cutting-edge research through the Umeå University Northern Star Fellows Programme. Through this university-wide initiative, we offer 10 early-career researchers the opportunity to develop their research over the long term through a six-year tenure-track assistant professorship, with the possibility of promotion to associate professor. All open calls in the initiative can be found here: https://www.umu.se/en/northern-star/northern-star-fellows/"
