details: "We are seeking to recruit a postdoctoral researcher to work on understanding the mechanisms of AI reasoning. Their core duty will be to advance our understanding of how LLMs acquire, integrate and reason over evolving, pluralistic knowledge using mechanistic interpretability methods. This can involve the development of novel conceptual frameworks, methods, or empirical studies. The postdoc’s duties will also to a small degree include teaching or supervision. The position is offered in the context of the context of an ERC Starting Grant held by Isabelle Augenstein on ‘Explainable and Robust Automatic Fact Checking (ExplainYourself)’, as well the Pioneer Centre for AI."
