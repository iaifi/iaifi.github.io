details: "The Physics Department of the Massachusetts Institute of Technology, located in Cambridge, MA, invites applications for a tenure-track faculty position in theoretical high-energy, nuclear, gravitational, and/or quantum physics, beginning July 1, 2027 or as soon as possible thereafter. We encourage applicants doing relevant research at any energy scale, including particle theory in and beyond the Standard Model; nuclear astrophysics; cosmology, dark matter and astroparticle physics; quantum field theory; QCD and strong interactions; string theory, classical and quantum gravity, holography, and mathematical physics; and theoretical quantum information science."
