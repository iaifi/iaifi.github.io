details: "The Artificial Intelligence Materials Institute (AI-MI) invites applications for the AI-MI Postdoctoral Fellowship. Established in 2025, AI-MI is the first NSF National AI Research Institute focused on materials science. AI-MI's mission is to shift materials discovery from serendipitous to intentional design, reducing discovery timelines from months to days while building reproducible, open workflows for the broader materials and AI research communities. For the postdoctoral fellowship, we seek candidates with a PhD in theoretical or computational condensed-matter physics, applied math, computer science, or a related discipline by the appointment start date. The fellowship is a full-time 12-month appointment with the potential for renewal up to two additional years, based on satisfactory performance and available funding. The anticipated start date is spring/summer 2027. The fellowship will be located on the main campus of Cornell University in Ithaca, New York. The Fellow will receive a salary of $80,000 and be eligible for Cornell University benefits. Fellows also receive up to $5,000 per year in discretionary research funds and support to attend at least one conference annually. "
