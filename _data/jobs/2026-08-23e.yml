details: "The Data Science Institute at the University of Chicago invites applications for the position of Senior Instructional Professor (open rank) to lead the Data Science Clinic. The Data Science Clinic is an experiential project-based course where students work in teams as data scientists with real-world clients from industry, academia, and social impact organizations. You can view more information about the DSI Clinic on our website here. The candidate will be appointed as Assistant Senior Instructional Professor, Associate Senior Instructional Professor, or Senior Instructional Professor, depending on qualifications and years of experience in a similar role. The appointment will be made in the Data Science Institute. The appointment will be for a term of up to five years, renewable. This is a career-track position with competitive salary and benefits. This position is expected to begin on or around December 1st, 2026."
