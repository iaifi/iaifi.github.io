details: "A full-time postdoctoral research associate position is open in the Lilley Research Group led by Prof. Carmen Lilley in the Department of Mechanical and Industrial Engineering at the University of Illinois Chicago. The selected candidate will engage in innovative research applying artificial intelligence and machine learning with density functional theory, or other similarly relevant computational methods, to advance understanding of materials design predictions for 2D and 3D systems with electronic and/or quantum material systems. A PhD in chemical engineering, chemistry, material science, physics, engineering or related field is required, along with a proven track record of conducting and publishing research in AI/ML and first principles modeling. Strong preference will be given for candidates skilled in machine learning/data science that have materials engineering/science research skills. "
