details: "Open to doctoral students pushing the frontiers of STEM – from applied mathematics and AI/CS to physics and statistics – Two Sigma’s PhD Fellowship invests in future leaders. Find eligibility, award details, the application timeline, and past recipients below. Applications must be on behalf of full-time students currently pursuing a PhD at an accredited university in the United States. Students must be in at least their 3rd year and must have at least 2 years remaining in their PhD program when the Fellowship begins (fall semester or quarter 2027)."
