details: "Boston University (BU) invites applications for a tenure-track assistant professor position in the Faculty of Computing & Data Sciences (CDS). All candidates pursuing foundational or use-inspired Data Science (DS) or Artificial Intelligence (AI) research will be considered. Candidates working in one or more of the following broad areas of AI for Science research are especially encouraged to apply: DS/AI-driven Bioinformatics, Computational Biology, and Life Sciences; DS-AI-driven Natural, Physical, and Earth Sciences; DS/AI for science methodologies, frameworks, and platforms."
