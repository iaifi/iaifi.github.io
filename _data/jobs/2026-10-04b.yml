details: "NSF-Simons AI Institute for Cosmic Origins (CosmicAI) seeks to hire a postdoctoral fellow to initiate a comprehensive research program exploring the surrogate modeling of astrophysical systems. Based at UT Austin, the Fellow will collaborate with CosmicAI researchers within the Oden Institute for Computational Engineering and Sciences and with team members across the Institute to develop cutting-edge AI tools and methodologies.  CosmicAI fellows will have full access to Institute facilities and equipment (e.g., world-class computational resources at the Texas Advanced Computing Center, including a newly instantiated 600 GPU node cluster)."
