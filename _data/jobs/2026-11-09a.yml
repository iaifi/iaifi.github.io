details: "The Department of Computer Science, in the Faculty of Science at Western University, is pleased to announce a search for a faculty position at the rank of Assistant Professor (Probationary Tenure-track) or Associate Professor (Probationary Tenure-track or Tenured). The salary and rank will be commensurate with the successful applicant’s qualifications and experience. The starting date will be July 1, 2027, or as negotiated.  ure-track assistant professor position in the Faculty of Computing & Data Sciences (CDS). All candidates pursuing foundational or use-inspired Data Science (DS) or Artificial Intelligence (AI) research will be considered. Candidates working in one or more of the following broad areas of AI for Science research are especially encouraged to apply: DS/AI-driven Bioinformatics, Computational Biology, and Life Sciences; DS-AI-driven Natural, Physical, and Earth Sciences; DS/AI for science methodologies, frameworks, and platforms."
