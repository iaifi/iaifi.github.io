details: "The Khoury College of Computer Sciences at Northeastern University has multiple tenure-track/tenured faculty positions at all ranks (Assistant Professor, Associate Professor, Full Professor), beginning academic year 2027-28 or 2028-29. The tenure home for this position will reside in the Khoury College of Computer Sciences, with a potential joint appointment in another Northeastern College (Bouvé College of Health Sciences; College of Art, Media, and Design; College of Engineering; College of Science; College of Social Sciences and Humanities; D’More-McKim School of Business; Mills College; School of Law), to be determined in consultation with the successful candidate. Academic rank at the Associate Professor and Full Professor levels will be commensurate with experience and qualifications reflecting a record of demonstrated teaching and scholarly excellence. We will consider candidates across all areas of computer science, whose research connects to the following sub-areas of AI: Physical AI; Human Centered AI; AI and Software Engineering; AI Safety, Security and Alignment." 
