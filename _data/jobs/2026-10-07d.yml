details: "The University of Chicago is implementing an ambitious plan for research and education in Data Science and AI, including new undergraduate and graduate academic programs and new cross-disciplinary research programs. The Data Science Institute  (datascience.uchicago.edu) is a collaboration among the Department of Computer Science (cs.uchicago.edu), the Department of Statistics (stat.uchicago.edu), and other units on campus. Topics of interest include safe and trustworthy AI, foundations and applications of artificial intelligence, world models, large language models, scientific AI, data ethics and privacy, data visualization, societal impacts of data and AI, data engineering, and scalable data and AI systems. The Data Science Institute focuses on fundamental advances at the intersection of data science, artificial intelligence, statistics, and computing in the context of real-world and domain-specific problems."
