details: "The School of Physics (https://physics.gatech.edu/) at the Georgia Institute of Technology in Atlanta, Georgia invites applications for an open-rank tenured/tenure-track faculty position at the interface between machine learning and physics. Applicants will be considered at all ranks. We anticipate hiring faculty working on advancing machine learning methodology as applied to quantum science, astrophysics, physics of living systems, nonlinear science, soft matter physics or other related areas. The faculty will be part of an initiative to catalyze machine-learning-driven research in the School of Physics and will benefit from substantial expertise and resources in artificial intelligence and machine learning that already exist in the Colleges of Sciences, Engineering, and Computing. Candidates are expected to demonstrate an exceptional commitment to the teaching and mentoring of students. Appointments at senior ranks will be considered for candidates with established and internationally recognized research programs."
